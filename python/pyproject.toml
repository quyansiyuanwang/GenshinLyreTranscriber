[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "glt-core"
version = "0.1.0"
description = "Offline transcription core for GenshinLyreTranscriber"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
  { name = "quyansiyuanwang" },
]
dependencies = [
  "basic-pitch==0.4.0",
  "jsonschema==4.26.0",
  "mido==1.3.3",
  "onnxruntime==1.30.0",
  "pretty-midi==0.2.11.post0",
  "setuptools==78.1.1",
  "soundfile==0.14.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pyinstaller==6.22.3",
  "pytest>=8.4",
  "ruff>=0.13",
  "types-jsonschema==4.26.0.20260518",
]
separator = [
  "demucs==4.1.0",
  "torch==2.11.0",
  "torchaudio==2.11.0",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]
override-dependencies = [
  "tensorflow<0; python_version < '0'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/glt_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["basic_pitch.*", "demucs.*", "mido.*", "onnxruntime", "pretty_midi.*", "scipy.*", "soundfile.*", "torch.*", "torchaudio.*"]
ignore_missing_imports = true
