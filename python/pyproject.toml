[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "glt-core"
version = "0.1.0"
description = "Offline transcription core for GenshinLyreTranscriber"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [
  { name = "quyansiyuanwang" },
]
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pytest>=8.4",
  "ruff>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/glt_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
