name: Nightly

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve revision
        id: revision
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0, 8)
          $date = (Get-Date).ToUniversalTime().ToString("yyyyMMdd")
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "short=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "date=$date" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.9.21

      - name: Sync locked Python environment
        run: uv sync --project python --locked

      - name: Fetch pinned model
        run: uv run --project python python scripts/fetch_resources.py basic-pitch

      - name: Full tests
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          uv run --directory python ruff check .
          uv run --directory python ruff format --check .
          uv run --directory python mypy .
          uv run --directory python pytest -q

      - name: Build nightly revision
        run: |
          cargo build --release --locked
          ./scripts/build_worker.ps1

      - name: Stage nightly package
        shell: pwsh
        run: |
          $stage = Join-Path (Resolve-Path 'artifacts').Path 'nightly-diagnostic'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target/release/glt.exe $stage
          Copy-Item artifacts/worker/glt-worker $stage -Recurse -Force
          Copy-Item LICENSE, README.md $stage
          Copy-Item docs $stage -Recurse -Force
          Get-ChildItem $stage -Recurse -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path.Substring($stage.Length + 1))" } |
            Set-Content (Join-Path $stage 'SHA256SUMS')

      - name: Create nightly release assets
        shell: pwsh
        run: |
          $releaseDir = Join-Path (Resolve-Path 'artifacts').Path 'nightly-release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $stage = Join-Path (Resolve-Path 'artifacts').Path 'nightly-diagnostic'
          $zip = Join-Path $releaseDir 'glt-nightly-windows-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  glt-nightly-windows-x64.zip" |
            Set-Content (Join-Path $releaseDir 'glt-nightly-windows-x64.sha256') -Encoding ascii

      - name: Upload nightly diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glt-nightly-windows-x64-${{ steps.revision.outputs.date }}-${{ steps.revision.outputs.short }}
          path: artifacts/nightly-diagnostic
          retention-days: 14
          if-no-files-found: error

      - name: Publish nightly pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: nightly
          name: Nightly
          target_commitish: ${{ steps.revision.outputs.sha }}
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            自动构建的 Windows x64 夜间版，不是稳定版本。

            - 提交：`${{ steps.revision.outputs.sha }}`
            - 日期：`${{ steps.revision.outputs.date }}`
            - 包含：`glt.exe`、打包 worker、README、文档和 SHA256 校验文件
            - 音频/视频转录仍可能要求可用的 FFmpeg/ffprobe

            请先核对资产旁的 `glt-nightly-windows-x64.sha256`，再解压运行。
          files: |
            artifacts/nightly-release/glt-nightly-windows-x64.zip
            artifacts/nightly-release/glt-nightly-windows-x64.sha256
