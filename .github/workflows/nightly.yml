name: Nightly

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve revision
        id: revision
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $short = $sha.Substring(0, 8)
          $date = (Get-Date).ToUniversalTime().ToString("yyyyMMdd")
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "short=$short" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "date=$date" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.9.21
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - name: Install frontend dependencies
        run: pnpm --dir crates/glt-gui install --frozen-lockfile

      - name: Sync locked Python environment
        run: uv sync --project python --locked

      - name: Fetch pinned model
        run: uv run --project python python scripts/fetch_resources.py basic-pitch

      - name: Full tests
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          uv run --directory python ruff check .
          uv run --directory python ruff format --check .
          uv run --directory python mypy .
          uv run --directory python pytest -q
          pnpm --dir crates/glt-gui check
          pnpm --dir crates/glt-gui test
          pnpm --dir crates/glt-gui build

      - name: Build nightly packages
        run: ./scripts/package_release.ps1 -AssetPrefix glt-nightly

      - name: Move fixed nightly tag
        shell: pwsh
        run: |
          $sha = "${{ steps.revision.outputs.sha }}"
          git tag -f nightly $sha
          $remote = git ls-remote --tags origin refs/tags/nightly
          if ($LASTEXITCODE -ne 0) { throw 'cannot inspect remote nightly tag' }
          if ($remote) {
            $old = $remote.Split()[0]
            git push --force-with-lease="refs/tags/nightly:$old" origin refs/tags/nightly
          } else {
            git push origin refs/tags/nightly
          }
          if ($LASTEXITCODE -ne 0) { throw 'cannot update remote nightly tag' }

      - name: Remove legacy nightly assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view nightly --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cannot inspect nightly release assets' }
          $existing = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in @('glt-nightly-windows-x64.zip', 'glt-nightly-windows-x64.sha256')) {
            if ($existing -contains $name) {
              gh release delete-asset nightly $name --yes
              if ($LASTEXITCODE -ne 0) { throw "cannot remove legacy nightly asset: $name" }
            }
          }
          Write-Host 'legacy nightly assets checked'

      - name: Upload nightly diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glt-nightly-windows-x64-${{ steps.revision.outputs.date }}-${{ steps.revision.outputs.short }}
          path: artifacts/release
          retention-days: 14
          if-no-files-found: error

      - name: Publish nightly pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: nightly
          name: Nightly
          target_commitish: ${{ steps.revision.outputs.sha }}
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            自动构建的 Windows x64 夜间版，不是稳定版本。

            - 提交：`${{ steps.revision.outputs.sha }}`
            - 日期：`${{ steps.revision.outputs.date }}`
            - 包含：GUI 安装器、GUI 便携 ZIP、CLI/TUI ZIP 和统一 SHA256 清单
            - 包含固定 LGPL FFmpeg/ffprobe，不要求用户另行安装
            - 可选 Demucs 分离组件通过独立工作流生成，不进入基础包

            请先核对 `glt-nightly-SHA256SUMS`，再运行安装器或解压。
          files: |
            artifacts/release/glt-nightly-gui-windows-x64-setup.exe
            artifacts/release/glt-nightly-gui-windows-x64.zip
            artifacts/release/glt-nightly-cli-tui-windows-x64.zip
            artifacts/release/glt-nightly-SHA256SUMS

      - name: Verify nightly release contract
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view nightly --json tagName,isPrerelease,targetCommitish,assets | ConvertFrom-Json
          if ($release.tagName -ne 'nightly') { throw 'nightly tag name mismatch' }
          if (-not $release.isPrerelease) { throw 'nightly release must be a pre-release' }
          if ($release.targetCommitish -ne '${{ steps.revision.outputs.sha }}') { throw 'nightly target commit mismatch' }
          $expected = @(
            'glt-nightly-gui-windows-x64-setup.exe',
            'glt-nightly-gui-windows-x64.zip',
            'glt-nightly-cli-tui-windows-x64.zip',
            'glt-nightly-SHA256SUMS'
          )
          $actual = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in $expected) {
            if ($actual -notcontains $name) { throw "nightly asset is missing: $name" }
          }
          $tagSha = (git ls-remote --tags origin refs/tags/nightly).Split()[0]
          if ($tagSha -ne '${{ steps.revision.outputs.sha }}') { throw "nightly tag points to $tagSha" }
