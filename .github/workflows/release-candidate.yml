name: Release candidate diagnostic

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version label
        required: true
      expected_sha:
        description: Exact commit SHA approved for the candidate
        required: true

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Verify exact commit
        id: revision
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          $expected = "${{ inputs.expected_sha }}".ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "candidate SHA mismatch: expected $expected, got $actual"
          }
          "sha=$actual" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.9.21
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
      - name: Install frontend dependencies
        run: pnpm --dir crates/glt-gui install --frozen-lockfile
      - name: Sync and fetch resources
        run: |
          uv sync --project python --locked
          uv run --project python python scripts/fetch_resources.py basic-pitch
      - name: Full candidate tests and build
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          uv run --directory python ruff check .
          uv run --directory python ruff format --check .
          uv run --directory python mypy .
          uv run --directory python pytest -q
          pnpm --dir crates/glt-gui check
          pnpm --dir crates/glt-gui test
          pnpm --dir crates/glt-gui build
          ./scripts/package_release.ps1 -AssetPrefix glt-candidate-${{ inputs.version }}
      - name: Playback clock gate
        run: cargo test -p glt preview::tests::real_playback_clock_error_is_bounded_when_device_is_available --locked
      - name: Short and long E2E gate
        run: |
          uv run --project python python scripts/e2e_gate.py --cli artifacts/release/.cli-stage/glt.exe --worker artifacts/release/.cli-stage/glt-worker/glt-worker.exe --output artifacts/e2e-candidate --short-seconds 2 --long-seconds 600
          $report = Get-Content artifacts/e2e-candidate/e2e-report.json -Raw | ConvertFrom-Json
          if ($report.gate.failures.Count -ne 0) {
            throw "E2E gate failures: $($report.gate.failures -join '; ')"
          }
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glt-e2e-${{ inputs.version }}-${{ steps.revision.outputs.sha }}
          path: artifacts/e2e-candidate/e2e-report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Upload diagnostic candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glt-candidate-diagnostic-${{ inputs.version }}-${{ steps.revision.outputs.sha }}
          path: artifacts/release
          retention-days: 14
          if-no-files-found: error
