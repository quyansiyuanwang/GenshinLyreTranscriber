name: Release candidate diagnostic

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version label
        required: true
      expected_sha:
        description: Exact commit SHA approved for the candidate
        required: true

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout approved commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Verify exact commit
        id: revision
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          $expected = "${{ inputs.expected_sha }}".ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "candidate SHA mismatch: expected $expected, got $actual"
          }
          "sha=$actual" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.9.21
      - name: Sync and fetch resources
        run: |
          uv sync --project python --locked
          uv run --project python python scripts/fetch_resources.py basic-pitch
      - name: Full candidate tests and build
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          uv run --project python ruff check .
          uv run --project python ruff format --check .
          uv run --project python mypy .
          uv run --project python pytest -q
          cargo build --release --locked
          ./scripts/build_worker.ps1
      - name: Stage diagnostic candidate
        shell: pwsh
        run: |
          $stage = Join-Path (Resolve-Path 'artifacts').Path 'candidate-diagnostic'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item target/release/glt.exe $stage
          Copy-Item artifacts/worker/glt-worker $stage -Recurse -Force
          Copy-Item LICENSE, README.md $stage
          Copy-Item docs $stage -Recurse -Force
          Get-ChildItem $stage -Recurse -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $($_.Path.Substring($stage.Length + 1))" } | Set-Content (Join-Path $stage 'SHA256SUMS')
      - name: Upload diagnostic candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glt-candidate-diagnostic-${{ inputs.version }}-${{ steps.revision.outputs.sha }}
          path: artifacts/candidate-diagnostic
          retention-days: 14
          if-no-files-found: error
