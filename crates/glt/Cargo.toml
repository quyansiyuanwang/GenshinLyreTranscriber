[package]
name = "glt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Offline Genshin Lyre transcription CLI and TUI"

[lib]
name = "glt"
path = "src/lib.rs"

[[bin]]
name = "glt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
ratatui = "0.30.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"

[dev-dependencies]
jsonschema = { version = "0.57.0", default-features = false }
