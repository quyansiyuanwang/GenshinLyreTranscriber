[package]
name = "glt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Offline Genshin Lyre transcription CLI and TUI"

[lib]
name = "glt"
path = "src/lib.rs"

[[bin]]
name = "glt"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
jsonschema = { version = "0.57.0", default-features = false }
